[pytest]
# deploy/ holds systemd units and install scripts -- nothing that should be
# collected. Byte-identical copies of the root test files have been landing
# there via scp (they exist on the server but not in this working copy), and
# pytest cannot collect two files with the same basename when neither
# directory is a package. That does not skip the duplicate: it aborts the
# ENTIRE run at collection, so one stray copy hides every test.
#
# Setting norecursedirs REPLACES pytest's defaults, so the patterns it would
# normally skip have to be restated -- `.*` above all, or .venv and .git get
# walked. `_*` covers holding folders like _stray/, which is where a copy was
# parked and promptly collided with the original all over again.
norecursedirs = .* _* deploy venv data __pycache__ node_modules web build dist *.egg
